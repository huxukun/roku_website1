<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南邮教务系统 · 体验重设计 | UI 课程作业</title>
  <meta name="description" content="南京邮电大学教务系统用户体验研究与概念重设计，UI 及交互设计课程作业，非官方站点。" />
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --blue: #1f6feb;
      --blue-deep: #0b3d91;
      --ink: #0f172a;
      --muted: #5b6472;
      --line: rgba(15, 23, 42, 0.08);
      --bg: #f5f7fb;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(31, 111, 235, 0.16), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(31, 111, 235, 0.10), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(680px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 24px 60px -28px rgba(15, 23, 42, 0.28);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(31, 111, 235, 0.08);
      color: var(--blue-deep);
      font-size: 13px;
      line-height: 1;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(26px, 4.6vw, 38px);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 2.4vw, 17px);
      line-height: 1.8;
    }

    .divider {
      height: 1px;
      margin: 28px 0;
      background: var(--line);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-size: 15px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(31, 111, 235, 0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      flex: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    .meta div {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfe;
    }

    .meta dt {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .meta dd {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    a {
      color: var(--blue-deep);
      text-decoration: none;
      border-bottom: 1px solid rgba(31, 111, 235, 0.35);
    }

    a:hover { border-bottom-color: var(--blue-deep); }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">课程作业 · 概念设计 · 非官方</span>

    <h1>南京邮电大学教务系统<br />用户体验重设计</h1>

    <p class="lead">
      选题基于真实的教务系统体验走查，重新设计登录、课表、成绩、选课、考试与评教等核心任务。
      本站为 UI 及交互设计课程作品集，站点正在建设中。
    </p>

    <div class="divider"></div>

    <div class="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      作品集网站建设中，即将上线
    </div>

    <dl class="meta">
      <div>
        <dt>项目类型</dt>
        <dd>UI 及交互设计实验课</dd>
      </div>
      <div>
        <dt>设计方法</dt>
        <dd>用户研究 · 竞品分析 · 交互原型</dd>
      </div>
      <div>
        <dt>部署分支</dt>
        <dd>feat/ui-coursework</dd>
      </div>
    </dl>

    <footer>
      <span>本页面为学习用途，与南京邮电大学官方无关。</span>
      <a href="https://www.rokunoworld.online">返回主站</a>
    </footer>
  </main>
</body>
</html>
