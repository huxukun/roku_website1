name: Sync Memory Blog

on:
  schedule:
    # UTC 22:10 = 北京时间次日 06:10（错开 05:20 的待办提醒）
    - cron: '10 22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [memory-updated]

concurrency:
  group: sync-memory-blog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myWebSite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync public memory cards to Supabase
        env:
          MEMORY_REPO: huxukun/second-brain-memory
          MEMORY_TOKEN: ${{ secrets.MEMORY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-memory-blog.mjs
